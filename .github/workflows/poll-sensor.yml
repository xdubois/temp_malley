name: Poll SwitchBot sensor

# Polls the Hub 2 over the SwitchBot Cloud API and appends one reading to
# data/sensor_auto.csv; the Pages workflow rebuilds the dashboard after each run.
on:
  schedule:
    # :07 and :37 — both on the 15-min grid. GitHub fires scheduled jobs 40-75
    # min late and skips some entirely, so two slots/hour ≈ hourly in practice.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-sensor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Poll the sensor
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          SWITCHBOT_DEVICE: ${{ secrets.SWITCHBOT_DEVICE }}
        # --script: inline PEP 723 deps (requests only) — skips installing the
        # dashboard's pandas/plotly stack on every poll
        run: uv run --script fetch_sensor.py

      - name: Commit the new reading (if any)
        run: |
          if [[ -z "$(git status --porcelain data/sensor_auto.csv)" ]]; then
            echo "No new reading to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sensor_auto.csv
          git commit -m "data: SwitchBot reading $(date -u +%FT%TZ)"
          # a manual push can race the poll — rebase once and retry
          git push || { git pull --rebase origin main && git push; }
