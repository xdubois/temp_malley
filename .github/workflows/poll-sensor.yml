name: Poll SwitchBot sensor

# Polls the Hub 2 over the SwitchBot Cloud API and appends one reading to
# data/sensor_auto.csv, and tops up data/outdoor_hourly.csv with the latest
# MeteoSwiss Pully measurements; the Pages workflow rebuilds the dashboard after
# each run.
on:
  schedule:
    # :07 and :37 — both on the 15-min grid. GitHub fires scheduled jobs 40-75
    # min late and skips some entirely, so two slots/hour ≈ hourly in practice.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-sensor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Poll the sensor
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          SWITCHBOT_DEVICE: ${{ secrets.SWITCHBOT_DEVICE }}
        # --script: inline PEP 723 deps (requests only) — skips installing the
        # dashboard's pandas/plotly stack on every poll
        run: uv run --script fetch_sensor.py

      - name: Update outdoor weather (MeteoSwiss Pully)
        # a MeteoSwiss hiccup must not block committing the sensor reading —
        # the next poll catches up on any missed hours
        continue-on-error: true
        run: uv run --script fetch_outdoor.py

      - name: Commit the new data (if any)
        run: |
          FILES="data/sensor_auto.csv data/outdoor_hourly.csv"
          if [[ -z "$(git status --porcelain $FILES)" ]]; then
            echo "No new data to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "data: SwitchBot reading + outdoor weather $(date -u +%FT%TZ)"
          # a manual push can race the poll — rebase once and retry
          git push || { git pull --rebase origin main && git push; }
